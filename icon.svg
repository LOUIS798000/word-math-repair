<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景圆角渐变：深邃科技蓝 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- 文档纸张渐变：质感纯净白色卡片 -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- 数学金光渐变：尊贵琥珀金 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- 科技青蓝渐变：Word 科技青 -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 修复微光星芒渐变 -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- 纸张深度柔和阴影 -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050B14" flood-opacity="0.38"/>
    </filter>

    <!-- 光芒柔光滤镜 -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. 外层基座：现代 Squircle 超圆角矩形 -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  
  <!-- 内部精致微高光描边 -->
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.22"/>

  <!-- 顶部科技微光弧面 -->
  <path d="M 128 24 Q 256 96 384 24" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- 2. 中层：悬浮的 Word A4 纸张排版卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="106" y="86" width="300" height="340" rx="24" fill="url(#paperGrad)"/>
    <!-- 纸张微边框 -->
    <rect x="107" y="87" width="298" height="338" rx="23" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- 顶部排版装饰细线（象征 Word 规范排版段落） -->
    <rect x="142" y="126" width="130" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="142" y="142" width="228" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="142" y="156" width="180" height="6" rx="3" fill="#E2E8F0"/>

    <!-- 底部排版平衡线 -->
    <rect x="142" y="364" width="228" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="142" y="378" width="150" height="6" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- 3. 核心数学符号组合：积分号 ∫ 与 求和号 ∑ 的完美交融 -->
  <g id="mathSymbols">
    <!-- 优雅平滑的现代积分符号 ∫ (优雅青蓝微光) -->
    <path d="M 194 204
             C 194 186, 180 180, 168 180
             C 156 180, 150 188, 150 196
             C 150 204, 158 208, 164 208
             C 172 208, 178 202, 178 196
             C 178 194, 176 190, 172 188
             C 174 187, 178 186, 182 189
             C 188 193, 188 202, 186 216
             L 168 300
             C 164 318, 160 334, 152 344
             C 144 354, 134 358, 122 358
             C 112 358, 106 350, 106 342
             C 106 334, 114 330, 120 330
             C 128 330, 134 336, 134 342
             C 134 344, 132 348, 128 350
             C 130 351, 134 352, 138 349
             C 144 345, 148 336, 152 322
             Z" 
          fill="url(#cyanGrad)" opacity="0.85"/>

    <!-- 经典壮美的求和符号 ∑ (立体琥珀金光) -->
    <path d="M 226 206 
             L 326 206 
             L 326 226 
             L 268 226 
             L 298 258 
             L 264 294 
             L 332 294 
             L 332 314 
             L 226 314 
             L 226 296 
             L 272 258 
             L 236 222 
             Z" 
          fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- 微分符号 dx / 字母 x 典雅修饰 -->
    <path d="M 334 252 
             C 334 246, 338 242, 344 242 
             C 350 242, 354 246, 354 252 
             L 354 278 
             C 354 284, 350 288, 344 288 
             C 338 288, 334 284, 334 278 
             Z" 
          fill="#3B82F6" opacity="0.7"/>
    <text x="342" y="274" font-family="'Times New Roman', serif" font-style="italic" font-size="28" font-weight="bold" fill="#1E40AF">dx</text>
  </g>

  <!-- 4. 修复与优化之星芒 (Repair Sparkles) -->
  <!-- 主星芒：璀璨明亮四角星 -->
  <path d="M 390 106 
           Q 390 132 416 132 
           Q 390 132 390 158 
           Q 390 132 364 132 
           Q 390 132 390 106 Z" 
        fill="url(#sparkleGrad)" filter="url(#glow)"/>

  <!-- 次级小星芒 -->
  <path d="M 432 168 
           Q 432 180 444 180 
           Q 432 180 432 192 
           Q 432 180 420 180 
           Q 432 180 432 168 Z" 
        fill="#FDE68A" opacity="0.95"/>

  <!-- 左侧点缀微星 -->
  <circle cx="120" cy="116" r="3.5" fill="#60A5FA" opacity="0.8"/>
  <circle cx="100" cy="136" r="2" fill="#93C5FD" opacity="0.6"/>
</svg>